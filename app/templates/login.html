<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Login | Enterprise POS</title>
  <meta name="description" content="Sign in to your Enterprise POS multi-tenant platform to manage your store.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-primary: #4f46e5;
      --color-primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a14;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 90%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      text-decoration: none;
      color: #ffffff;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--color-primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-md);
      padding: 36px;
      box-shadow:
        0 20px 40px -15px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
      text-align: center;
      color: #ffffff;
    }

    p.subtitle {
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      font-family: 'Inter', sans-serif;
      padding: 11px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      width: 100%;
      font-size: 14px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
    }

    input::placeholder {
      color: #475569;
    }

    select option {
      background: #1e293b;
      color: #f1f5f9;
    }

    input:focus, select:focus {
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(255, 255, 255, 0.07);
    }

    .btn {
      display: block;
      width: 100%;
      background: var(--color-primary-gradient);
      color: #ffffff;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
      letter-spacing: 0.01em;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .btn:active { transform: translateY(0); }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      box-shadow: none;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      box-shadow: none;
      transform: none;
    }

    .flash {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(-8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .divider {
      display: flex;
      align-items: center;
      color: #334155;
      font-size: 12px;
      margin: 24px 0 0;
      gap: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>
<div class="wrap">
  <a class="brand-logo" href="/">
    <div class="logo-icon">P</div>
    <div class="logo-text">Enterprise POS</div>
  </a>

  <div class="card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to manage your multi-tenant POS store</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="form-group">
        <label>Select Business (Tenant)</label>
        <select name="tenant_id" required>
          <option value="">Choose your store...</option>
          {% for t in tenants %}
            <option value="{{ t.id }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input name="email" type="email" placeholder="you@company.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" placeholder="••••••••" required>
      </div>

      <button class="btn" type="submit">Sign In →</button>
    </form>

    <div class="divider">or</div>
    <a class="btn btn-secondary" href="/tenant/create">Register a New Store</a>
  </div>
</div>
</body>
</html>
